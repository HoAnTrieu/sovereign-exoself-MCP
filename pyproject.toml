[project]
name = "sovereign-exoself-mcp"
version = "0.1.0"
description = "Local MCP personal council with durable SQLite memory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiosqlite>=0.21,<1",
  "litellm>=1.81,<2",
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/sovereign_exoself_mcp/memory.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["sovereign_exoself_mcp"]
warn_unused_ignores = true
